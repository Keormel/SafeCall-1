[project]
name = "safecall-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "ASYNC"]
ignore = [
    "B008",    # FastAPI's Depends()/Query() in defaults is the framework idiom
    "RUF001",  # Cyrillic text in strings is intentional
    "RUF002",
    "RUF003",
    "RUF005",  # list concatenation reads fine here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E731", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["alembic/versions", "tests/perf/locustfile.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# No real network in tests: only loopback (fakeredis TCP server) is allowed.
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost -p no:cacheprovider"
markers = [
    "unit: pure logic and engine tests (fast)",
    "api: HTTP-level tests through the ASGI app (fast)",
    "security: injection, abuse, rate limits, privacy",
    "perf: query counts and latency on large data (slow)",
    "e2e: migrations, seed and the demo scenario end to end",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
skip_empty = true
