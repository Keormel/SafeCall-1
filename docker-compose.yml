name: safecall

services:
  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-safecall}:${POSTGRES_PASSWORD:-safecall}@postgres:5432/${POSTGRES_DB:-safecall}
      REDIS_URL: redis://redis:6379/0
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin-api:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install --quiet --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload"
    env_file:
      - path: ./admin-morda-sasha/.env
        required: false
    environment:
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-dev-admin-secret-change-me}
      ADMIN_JWT_ALGORITHM: ${ADMIN_JWT_ALGORITHM:-HS256}
      ADMIN_ACCESS_TOKEN_EXPIRE_MINUTES: ${ADMIN_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-mainadmin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me-admin-password}
      MOCK_MODE: ${MOCK_MODE:-true}
      DATA_SOURCE: ${DATA_SOURCE:-mock}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-safecall}:${POSTGRES_PASSWORD:-safecall}@postgres:5432/${POSTGRES_DB:-safecall}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./admin-morda-sasha:/app
    ports:
      - "${ADMIN_API_PORT:-8100}:8100"
    depends_on:
      postgres:
        condition: service_healthy

  admin-morda:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://admin-api:8100
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ./admin-morda-sasha/frontend:/app
      - /app/node_modules
    ports:
      - "${ADMIN_MORDA_PORT:-5173}:5173"
    depends_on:
      admin-api:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safecall}
      POSTGRES_USER: ${POSTGRES_USER:-safecall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safecall}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
