name: perf (manual)

on:
  workflow_dispatch:
    inputs:
      users: {description: "Concurrent users", default: "200"}
      duration: {description: "Run time", default: "3m"}

defaults:
  run:
    working-directory: backend

jobs:
  load:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: safecall, POSTGRES_USER: safecall, POSTGRES_PASSWORD: safecall}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U safecall" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://safecall:safecall@localhost:5432/safecall
      TEST_DATABASE_URL: postgresql+asyncpg://safecall:safecall@localhost:5432/safecall
      RATE_LIMIT_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - name: Latency and N+1 checks on 100k numbers (Postgres)
        run: pytest -m perf -q
      - name: Start API with seed data
        run: |
          alembic upgrade head
          python -m scripts.seed --reset
          uvicorn app.main:app --port 8000 --workers 2 &
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
      - name: Mixed load (70% check, 20% sync, 10% report)
        run: >
          locust -f tests/perf/locustfile.py --host http://localhost:8000 --headless --only-summary
          --users ${{ inputs.users }} --spawn-rate 20 --run-time ${{ inputs.duration }} --csv perf
      - name: Pass criteria (no 5xx, p95 check < 200 ms, p95 sync < 500 ms)
        run: |
          python - <<'PY'
          import csv, sys
          rows = {r["Name"]: r for r in csv.DictReader(open("perf_stats.csv"))}
          failures = [r for r in csv.DictReader(open("perf_failures.csv")) if r["Error"].startswith("HTTPError('5")]
          p95 = lambda name: float(rows[name]["95%"])
          problems = []
          if failures: problems.append(f"5xx responses: {failures}")
          if p95("check-number") >= 200: problems.append(f"check-number p95 {p95('check-number')} ms")
          if p95("sync (delta)") >= 500: problems.append(f"sync p95 {p95('sync (delta)')} ms")
          print("\n".join(problems) or "perf OK")
          sys.exit(1 if problems else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: locust-report, path: "backend/perf_*.csv"}
