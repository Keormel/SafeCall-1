name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "shared/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "shared/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check app scripts tests
      - run: mypy app

  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - name: Fast set (unit + api), must stay under 60 s
        run: timeout 60 pytest -m "unit or api" -q
      - name: Full suite with coverage
        run: pytest -m "not perf" -q --cov=app --cov-report=json --cov-report=term
      - name: Coverage gates (core >= 95%, total >= 85%)
        run: python tests/check_coverage.py coverage.json
      - uses: actions/upload-artifact@v4
        with: {name: coverage-sqlite, path: backend/coverage.json}

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: safecall_test, POSTGRES_USER: safecall, POSTGRES_PASSWORD: safecall}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U safecall -d safecall_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://safecall:safecall@localhost:5432/safecall_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - name: Migrations on a real Postgres
        run: DATABASE_URL=$TEST_DATABASE_URL alembic upgrade head && DATABASE_URL=$TEST_DATABASE_URL alembic check && DATABASE_URL=$TEST_DATABASE_URL alembic downgrade base
      - name: Suite on Postgres (advisory locks, JSONB, READ COMMITTED races)
        run: pytest -m "not perf and not e2e" -q
